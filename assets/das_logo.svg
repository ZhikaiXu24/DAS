<svg xmlns="http://www.w3.org/2000/svg" width="1455" height="250" viewBox="0 0 1455 250" role="img" aria-labelledby="title desc">
  <title id="title">Deep Academic Survey</title>
  <desc id="desc">Deep Academic Survey and its publication-oriented academic survey generation tagline.</desc>
  <defs>
    <linearGradient id="publicationGradient" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="465" y2="0">
      <stop offset="0%" stop-color="#59CCFF" />
      <stop offset="52%" stop-color="#B750F0" />
      <stop offset="100%" stop-color="#FF950D" />
    </linearGradient>
    <linearGradient id="backgroundGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111722" />
      <stop offset="50%" stop-color="#0b0910" />
      <stop offset="100%" stop-color="#070807" />
    </linearGradient>
  </defs>
  <rect width="1455" height="250" fill="url(#backgroundGlow)" />
  <g opacity="0.13" stroke="#667085" stroke-width="1">
