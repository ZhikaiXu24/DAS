    <tspan fill="#59CCFF">D</tspan><tspan fill="#F7F7FA">eep </tspan><tspan fill="#B750F0">A</tspan><tspan fill="#F7F7FA">cademic </tspan><tspan fill="#FF950D">S</tspan><tspan fill="#F7F7FA">urvey:</tspan>
